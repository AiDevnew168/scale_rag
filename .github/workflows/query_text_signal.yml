name: Incoming semantic question shift signal
on:
  push:
    paths:
      - 'research/bridge_partition/query_text_signal.py'
      - '.github/workflows/query_text_signal.yml'
  workflow_dispatch:
jobs:
  signal:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    strategy:
      fail-fast: false
      matrix:
        family: [bridge_chain, synthesis]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install numpy==2.1.3 pymetis==2025.2.2 scikit-learn==1.6.1 zstandard==0.23.0
      - name: Test observed query text for budgeted placement
        env:
          ONLINE_SOURCE: ${{ matrix.family }}
        run: python research/bridge_partition/query_text_signal.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: query-text-signal-${{ matrix.family }}
          path: results_text_signal_${{ matrix.family }}/
          if-no-files-found: warn
