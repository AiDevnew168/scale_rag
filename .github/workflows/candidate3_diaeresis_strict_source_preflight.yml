name: Candidate 3 published DIAERESIS original RDF strict common-input normalization
on:
  push:
    paths:
      - '.github/workflows/candidate3_diaeresis_strict_source_preflight.yml'
      - 'research/bridge_partition/candidate3_diaeresis_strict_rdf_normalization.py'
  workflow_dispatch:
jobs:
  strict-same-graph-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned strict RDF parser
        run: pip install pyoxigraph==0.5.13
      - name: Verify deterministic complete-source RDF normalization with zero discarded triples
        run: python -u research/bridge_partition/candidate3_diaeresis_strict_rdf_normalization.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: candidate3-original-DIAERESIS-RDF-normalization-evidence
          path: results_candidate3_diaeresis_normalization/report.json
          if-no-files-found: error
