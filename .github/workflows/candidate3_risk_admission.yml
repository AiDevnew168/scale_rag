name: Candidate 3 risk-admitted chronological one-swap audit
on:
  push:
    paths:
      - '.github/workflows/candidate3_risk_admission.yml'
  workflow_dispatch:
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        month: [january, february, march]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install numpy==2.1.3 pymetis==2025.2.2 mtkahypar==1.7.1 scikit-learn==1.6.1
      - name: Predeclared chronological day0/canary/future decision
        env:
          ADMISSION_MONTH: ${{ matrix.month }}
        run: python research/bridge_partition/candidate3_risk_admission.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: candidate3-risk-admission-${{ matrix.month }}
          path: results_risk_admission_${{ matrix.month }}/
          if-no-files-found: error
