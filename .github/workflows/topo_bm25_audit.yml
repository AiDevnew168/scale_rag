name: TopoGraphRAG independent BM25 candidate pool test
on:
  push:
    paths:
      - research/topo_fea/bm25_audit.py
      - .github/workflows/topo_bm25_audit.yml
  workflow_dispatch:
jobs:
  bm25:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pinned dependencies
        run: python -m pip install numpy==2.1.3 scikit-learn==1.6.1 zstandard==0.23.0 rank-bm25==0.2.2
      - name: Execute real-layout lexical-pool controls
        run: python -u research/topo_fea/bm25_audit.py
      - name: Archive results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: topo-bm25-controls
          path: results_bm25/
          if-no-files-found: warn
