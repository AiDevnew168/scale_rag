name: TopoGraphRAG exact same-query cross-run comparison
on:
  push:
    paths:
      - research/topo_fea/merge_baselines.py
      - .github/workflows/topo_crossrun_compare.yml
jobs:
  merge:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/download-artifact@v4
        with:
          name: topo-bm25-controls
          path: artifacts_bm25/
          run-id: 44501655663
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: topo-ce-300-frozen-pool
          path: artifacts_ce/
          run-id: 44501115217
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: topo-ce-frozen-structural-results
          path: artifacts_structural/
          run-id: 44503429070
          github-token: ${{ github.token }}
      - run: python -m pip install numpy==2.1.3
      - name: Verify identical question sets, compare in paired document clusters
        run: python -u research/topo_fea/merge_baselines.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: topo-combined-gate-result
          path: crossrun_report.json
          if-no-files-found: warn
