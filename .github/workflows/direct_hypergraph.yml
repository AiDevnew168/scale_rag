name: Direct Mt-KaHyPar versus METIS frozen workloads
on:
  push:
    paths: ['research/bridge_partition/direct_hypergraph.py','.github/workflows/direct_hypergraph.yml']
  workflow_dispatch:
jobs:
  hypergraph:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        scenario: [random, bridge_to_synthesis, synthesis_to_bridge]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install numpy==2.1.3 pymetis==2025.2.2 mtkahypar==1.7.1
      - name: Compare direct weighted query hyperedges with balanced METIS
        env:
          BRIDGE_SCENARIO: ${{ matrix.scenario }}
        run: python research/bridge_partition/direct_hypergraph.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: direct-hypergraph-${{ matrix.scenario }}
          path: results_hypergraph_${{ matrix.scenario }}/
          if-no-files-found: warn
