name: Candidate 3 SWDF three-BGP blanknode source-scope explanation
on:
  push:
    paths:
      - '.github/workflows/candidate3_swdf_bnode_join_root.yml'
      - 'research/bridge_partition/candidate3_swdf_bnode_join_root.py'
  workflow_dispatch:
jobs:
  stagewise-BGP-equivalence:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install original SPARQL engines
        run: pip install pyoxigraph==0.5.13 rdflib==7.5.0 gdown==5.2.0
      - name: Execute and compare one-two-three triple joins over full and extracted original RDF
        run: python -u research/bridge_partition/candidate3_swdf_bnode_join_root.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: candidate3-SWDF-three-BGP-source-blanknode-diagnostics
          path: results_candidate3_SWDF_blanknode_join_root/report.json
          if-no-files-found: error
