name: Candidate 3 external original WatDiv 10M physical-byte transfer test
on:
  push:
    paths:
      - '.github/workflows/candidate3_official_watdiv_byte_transfer.yml'
      - 'research/bridge_partition/candidate3_official_watdiv_byte_transfer.py'
  workflow_dispatch:
jobs:
  pinned-third-family-transfer:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Audit true 10M triple predicate bytes and evaluate heldout five stress workloads
        run: python -u research/bridge_partition/candidate3_official_watdiv_byte_transfer.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: candidate3-original-WatDiv10M-byte-weighted-transfer
          path: results_candidate3_official_watdiv/report.json
          if-no-files-found: error
