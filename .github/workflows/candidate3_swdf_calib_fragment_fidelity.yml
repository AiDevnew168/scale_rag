name: Candidate 3 SWDF physical fragment identity under 4 policies
on:
  push:
    paths:
      - '.github/workflows/candidate3_swdf_calib_fragment_fidelity.yml'
      - 'research/bridge_partition/candidate3_swdf_calib_fragment_fidelity.py'
  workflow_dispatch:
jobs:
  independent-rdf-fragment-check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install fixed RDF/SPARQL parsers and original SWDF transport
        run: pip install pyoxigraph==0.5.13 rdflib==7.5.0 gdown==5.2.0
      - name: Compare full real RDF predicate fragments across four physical shard policies
        run: python -u research/bridge_partition/candidate3_swdf_calib_fragment_fidelity.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: candidate3-SWDF-calib-physical-fragment-fidelity
          path: results_candidate3_swdf_calibration_fragment_fidelity/report.json
          if-no-files-found: error
