name: Document-disjoint coaccess prediction and placement
on:
  push:
    paths: ['research/bridge_partition/document_transfer.py','.github/workflows/document_transfer.yml']
  workflow_dispatch:
jobs:
  transfer:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install numpy==2.1.3 scipy==1.14.1 scikit-learn==1.6.1 pymetis==2025.2.2 zstandard==0.23.0
      - name: Fit on old documents, evaluate placements on wholly unseen documents
        run: python research/bridge_partition/document_transfer.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: doc-disjoint-coaccess
          path: results_doc_heldout/
          if-no-files-found: warn
