name: Candidate 3 exact four-shard routing invariants
on:
  push:
    paths:
      - '.github/workflows/candidate3_routing_invariants.yml'
      - 'research/bridge_partition/test_candidate3_replica_routing.py'
  workflow_dispatch:
jobs:
  proof-checked-routing:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify exhaustive 4-shard replication and move regression cases
        run: python research/bridge_partition/test_candidate3_replica_routing.py
