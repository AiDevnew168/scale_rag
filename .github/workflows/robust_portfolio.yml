name: Train-only robust hypergraph portfolio under workload shift
on:
  push:
    paths: ['research/bridge_partition/robust_portfolio.py','.github/workflows/robust_portfolio.yml']
  workflow_dispatch:
jobs:
  portfolio:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        scenario: [random, bridge_to_synthesis, synthesis_to_bridge]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install numpy==2.1.3 pymetis==2025.2.2 mtkahypar==1.7.1
      - name: Compare train-only robust portfolio with existing strong methods
        env:
          BRIDGE_SCENARIO: ${{ matrix.scenario }}
        run: python research/bridge_partition/robust_portfolio.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: robust-portfolio-${{ matrix.scenario }}
          path: results_portfolio_${{ matrix.scenario }}/
          if-no-files-found: warn
