name: Candidate 3 four calibration true-empty SPARQL root-cause
on:
  push:
    paths:
      - '.github/workflows/candidate3_swdf_calibration_forensics.yml'
      - 'research/bridge_partition/candidate3_swdf_calibration_forensics.py'
  workflow_dispatch:
jobs:
  explain-missing-results:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install original frozen full query interpreter
        run: pip install pyoxigraph==0.5.13 rdflib==7.5.0 gdown==5.2.0
      - name: Inspect original four already-known calibration failures and exact RDF bytes
        run: python -u research/bridge_partition/candidate3_swdf_calibration_forensics.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: candidate3-four-SWDF-calibration-rootcause
          path: results_candidate3_SWDF_semantic_forensics/report.json
          if-no-files-found: error
