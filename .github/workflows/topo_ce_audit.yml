name: TopoGraphRAG cross-encoder controlled retrieval test
on:
  push:
    paths:
      - research/topo_fea/ce_audit.py
      - .github/workflows/topo_ce_audit.yml
  workflow_dispatch:
jobs:
  cross-encoder:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      TOKENIZERS_PARALLELISM: "false"
      OMP_NUM_THREADS: "4"
      MKL_NUM_THREADS: "4"
      HF_HUB_DISABLE_TELEMETRY: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install CPU PyTorch
        run: python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.5.1
      - name: Install pinned retrieval dependencies
        run: python -m pip install numpy==2.1.3 scikit-learn==1.6.1 zstandard==0.23.0 sentence-transformers==5.1.2
      - name: Rerank real Top-50 with MS MARCO CrossEncoder on CPU
        run: python -u research/topo_fea/ce_audit.py
      - name: Preserve scores and report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: topo-ce-300-frozen-pool
          path: results_ce/
          if-no-files-found: warn
