name: TopoGraphRAG frozen CE structural comparison
on:
  workflow_run:
    workflows: ["TopoGraphRAG cross-encoder controlled retrieval test"]
    types: [completed]
  workflow_dispatch:
jobs:
  compare:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Download exact CE rankings from audited run
        uses: actions/download-artifact@v4
        with:
          name: topo-ce-300-frozen-pool
          path: results_ce/
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - name: Install pinned post-hoc dependencies
        run: python -m pip install numpy==2.1.3 scikit-learn==1.6.1 zstandard==0.23.0
      - name: Score pair matching and MMR on unchanged CE scores
        run: python -u research/topo_fea/ce_structural_post.py
      - name: Save structural audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: topo-ce-frozen-structural-results
          path: results_ce_post/
          if-no-files-found: warn
