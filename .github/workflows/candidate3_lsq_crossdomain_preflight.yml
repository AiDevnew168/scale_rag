name: Candidate 3 independent LSQ2 real query-log eligibility
on:
  push:
    paths:
      - '.github/workflows/candidate3_lsq_crossdomain_preflight.yml'
      - 'research/bridge_partition/candidate3_lsq_crossdomain_preflight.py'
  workflow_dispatch:
jobs:
  bound-and-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Inspect only bounded untuned LSQ2 real SPARQL log source metadata
        run: python -u research/bridge_partition/candidate3_lsq_crossdomain_preflight.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: candidate3-LSQ-source-eligibility
          path: results_candidate3_LSQ_preflight/report.json
          if-no-files-found: error
