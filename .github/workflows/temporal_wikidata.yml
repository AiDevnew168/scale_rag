name: Prospective genuine Wikidata workload partition gate
on:
  push:
    paths: ['research/bridge_partition/temporal_wikidata.py', '.github/workflows/temporal_wikidata.yml']
  workflow_dispatch:
jobs:
  time-split:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install numpy==2.1.3 pymetis==2025.2.2 scikit-learn==1.6.1
      - name: Train on days 1-14, test untouched days 22-28
        run: python research/bridge_partition/temporal_wikidata.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: real-wikidata-time-split
          path: results_temporal/
          if-no-files-found: warn
