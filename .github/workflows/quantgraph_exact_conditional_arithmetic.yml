name: QuantGraph exact rational conditional chart-bound core independent Python CI
on:
  push:
    paths:
      - '.github/workflows/quantgraph_exact_conditional_arithmetic.yml'
      - 'research/quantgraph_p0/exact_affine.py'
      - 'research/quantgraph_p0/test_exact_affine.py'
  workflow_dispatch:
jobs:
  exact_conditional_math_not_image_certification:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Standard-library rational vertex arithmetic, no binary float optimizer
        run: python -m unittest discover -s research/quantgraph_p0 -p test_exact_affine.py -v
      - name: Print strict no-overclaim test vector
        run: |
          python - <<'PY'
          import sys
          sys.path.insert(0,'research/quantgraph_p0')
          from exact_affine import ExactSharedAxis,Tick,Mark
          model=ExactSharedAxis([Tick('100','-2','2'),Tick('0','98','102')],[Mark('A','20','20'),Mark('B','80','80')],'decreasing',True)
          low,high=model.bound({'A':'1','B':'-1'})
          assert (str(low),str(high))==('288/5','312/5')
          assert model.evidence_flags()['image_or_RAG_correctness_certified'] is False
          print('EXACT_CONDITIONAL_BOUNDS', str(low), str(high), 'NOT_VISUAL_CERTIFICATION')
          PY
