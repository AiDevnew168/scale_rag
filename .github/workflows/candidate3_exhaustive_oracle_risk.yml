name: Candidate 3 exhaustive future-oracle novelty risk frontier
on:
  push:
    paths:
      - '.github/workflows/candidate3_exhaustive_oracle_risk.yml'
      - 'research/bridge_partition/candidate3_exhaustive_oracle_risk.py'
  workflow_dispatch:
jobs:
  exact-one-swap-oracle:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        month: [january, february, march]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install numpy==2.1.3 pymetis==2025.2.2 mtkahypar==1.7.1 scikit-learn==1.6.1
      - name: Enumerate 5,400 one-swap hindsight feasibility bounds
        env:
          ORACLE_MONTH: ${{ matrix.month }}
        run: python -u research/bridge_partition/candidate3_exhaustive_oracle_risk.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: candidate3-oracle-${{ matrix.month }}
          path: results_candidate3_oracle_${{ matrix.month }}/
          if-no-files-found: error
