name: Topo structural-label audit
on:
  push:
    paths: ['.github/workflows/topo_structure_schema.yml']
  workflow_dispatch:
jobs:
  profile:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Audit real question and relation annotation fields
        run: |
          python - <<'PY'
          import urllib.request,json,collections,hashlib
          u='https://huggingface.co/datasets/diandianone123/topographrag-bench/resolve/main/annotations/benchmark.json'
          raw=urllib.request.urlopen(u,timeout=90).read()
          q=json.loads(raw)
          print('SHA256',hashlib.sha256(raw).hexdigest(),'N',len(q))
          for kind in ('bridge_chain','synthesis','single_hop'):
            arr=[x for x in q if x.get('question_type')==kind]
            print('KIND',kind,'N',len(arr))
            keys=collections.Counter(k for x in arr for k in x)
            print('TOPLEVEL_KEYS',json.dumps(keys.most_common(60)))
            for x in arr[:2]:
              print('SAMPLE',kind,'ID',x.get('mh_id'),x.get('sq_id'),'DOC',x.get('doc_id'),'NUM_HOPS',x.get('num_hops'))
              for fld in ('evidence_sources','answer','evidence_validation','bridge_entities','reasoning_trace','reasoning_chain','question_subtype','cross_modal','hop_details','structural_requirements'):
                val=x.get(fld)
                if val is not None:
                  print('FIELD',fld,'TYPE',type(val).__name__,'VALUE',json.dumps(val,ensure_ascii=False)[:1400])
            if kind=='bridge_chain':
              n=collections.Counter(len(x.get('evidence_sources') or []) for x in arr)
              print('BRIDGE_EVIDENCE_LENGTH',json.dumps(dict(n)))
              print('BRIDGE_ITEM_KEYS',collections.Counter(tuple(sorted(e.keys())) for x in arr for e in x.get('evidence_sources',[])).most_common(10))
            if kind=='synthesis':
              print('SYN_ANSWER_KEYS',collections.Counter(tuple(sorted((x.get('answer') or {}).keys())) for x in arr).most_common(10))
          PY
