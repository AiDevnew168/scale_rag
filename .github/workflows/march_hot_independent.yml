name: Frozen March 2018 new unique-pattern holdout
on:
  push:
    paths:
      - '.github/workflows/march_hot_independent.yml'
  workflow_dispatch:
jobs:
  march-holdout:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install numpy==2.1.3 pymetis==2025.2.2 scikit-learn==1.6.1 mtkahypar==1.7.1
      - name: Locked frozen December-origin adaptation on March (no future labels)
        env:
          HOT_MONTH: march
        run: python research/bridge_partition/independent_month_burst.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: march-novel-pattern-independent
          path: results_independent_hot_march/
          if-no-files-found: warn
