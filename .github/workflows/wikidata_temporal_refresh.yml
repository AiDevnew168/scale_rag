name: Wikidata temporal 28-day bounded migration and recency audit
on:
  push:
    paths:
      - 'research/bridge_partition/temporal_refresh.py'
      - '.github/workflows/wikidata_temporal_refresh.yml'
  workflow_dispatch:
jobs:
  temporal-refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install numpy==2.1.3 pymetis==2025.2.2 scikit-learn==1.6.1
      - name: Strict untouched future-week and 10-percent migration evaluation
        run: python research/bridge_partition/temporal_refresh.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wikidata-temporal-refresh-results
          path: results_temporal_refresh/
          if-no-files-found: warn
