name: Bridge workload-shift robustness check
on:
  push:
    paths:
      - '.github/workflows/bridge_shift.yml'
  workflow_dispatch:
jobs:
  two-direction-transfer:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        scenario: [bridge_to_synthesis, synthesis_to_bridge]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install fixed METIS partitioning dependencies
        run: pip install numpy==2.1.3 pymetis==2025.2.2
      - name: Evaluate held-out topology-family transfer
        env:
          BRIDGE_SCENARIO: ${{ matrix.scenario }}
        run: python research/bridge_partition/pilot.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bridge-shift-${{ matrix.scenario }}
          path: results_bridge_${{ matrix.scenario }}/
          if-no-files-found: warn
