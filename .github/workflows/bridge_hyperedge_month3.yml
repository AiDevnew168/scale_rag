name: Third-month unseen hyperedge generalization test
on:
  push:
    paths:
      - 'research/bridge_partition/hyperedge_generalization.py'
      - '.github/workflows/bridge_hyperedge_month3.yml'
  workflow_dispatch:
jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install numpy==2.1.3 scikit-learn==1.6.1 pymetis==2025.2.2 mtkahypar==1.7.1
      - name: July-only model selection and unseen August-month test
        run: python research/bridge_partition/hyperedge_generalization.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: third-month-hyperedge-generalization
          path: results_hyperedge_generalization/
          if-no-files-found: warn
