name: Candidate 3 independent 2026 RDF federated QUERY-only interoperability readiness
on:
  push:
    paths:
      - '.github/workflows/candidate3_external_largerdfbench2026_query_gate.yml'
      - 'research/bridge_partition/candidate3_external_largerdfbench2026_query_gate.py'
      - 'research/bridge_partition/test_candidate3_external_largerdfbench2026_query_gate.py'
  workflow_dispatch:
jobs:
  original_public_benchmark_queries:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pyoxigraph==0.5.13 rdflib==7.5.0
      - name: External public ZIP safety and dual-engine parser tests
        run: python -m unittest research/bridge_partition/test_candidate3_external_largerdfbench2026_query_gate.py -v
      - name: Original independent published 2026 public query inventory and compatibility
        run: python -u research/bridge_partition/candidate3_external_largerdfbench2026_query_gate.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: candidate3-independent-2026-original-LargeRDFBench-query-compatibility
          path: results_candidate3_external_LargeRDFBench2026_query_gate/report.json
          if-no-files-found: warn
