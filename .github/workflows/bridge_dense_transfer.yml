name: Cross-document dense coaccess prediction gate
on:
  push:
    paths:
      - 'research/bridge_partition/dense_transfer.py'
      - '.github/workflows/bridge_dense_transfer.yml'
  workflow_dispatch:
jobs:
  dense:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install frozen real encoder and partition solver
        run: pip install numpy==2.1.3 scipy==1.14.1 scikit-learn==1.6.1 pymetis==2025.2.2 zstandard==0.23.0 'sentence-transformers==3.4.1' 'transformers==4.49.0'
      - name: Run document-disjoint dense relation forecasting benchmark
        run: python research/bridge_partition/dense_transfer.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dense-coaccess-document-disjoint
          path: results_dense_transfer/
          if-no-files-found: warn
