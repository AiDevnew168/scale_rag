name: TopoGraphRAG five-shard CE plus structural controls
on:
  push:
    paths:
      - research/topo_fea/ce_shard.py
      - research/topo_fea/ce_aggregate.py
      - .github/workflows/topo_ce_shards.yml
  workflow_dispatch:
jobs:
  cross-encoder-shards:
    name: CE shard ${{ matrix.shard }}
    runs-on: ubuntu-latest
    timeout-minutes: 55
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4]
    env:
      CE_SHARD: ${{ matrix.shard }}
      TOKENIZERS_PARALLELISM: "false"
      OMP_NUM_THREADS: "4"
      MKL_NUM_THREADS: "4"
      HF_HUB_DISABLE_TELEMETRY: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.5.1
      - run: python -m pip install numpy==2.1.3 scikit-learn==1.6.1 zstandard==0.23.0 sentence-transformers==5.1.2
      - name: Score frozen real candidate pool
        run: python -u research/topo_fea/ce_shard.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: topo-ce-shard-${{ matrix.shard }}
          path: results_ce_shard/
          if-no-files-found: warn
  aggregate:
    name: Independent fingerprint checks and paired CE/structural analysis
    needs: [cross-encoder-shards]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/download-artifact@v4
        with:
          pattern: topo-ce-shard-*
          path: results_ce_shards/
          merge-multiple: true
      - run: python -m pip install numpy==2.1.3 scikit-learn==1.6.1 zstandard==0.23.0
      - name: Check full 300-query CE score reproduction and bootstrap
        run: python -u research/topo_fea/ce_aggregate.py
      - name: Compare exact role assignment, greedy and MMR using same CE scores
        run: python -u research/topo_fea/ce_structural_post.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: topo-ce-300-and-matching-report
          path: |
            results_ce/
            results_ce_post/
          if-no-files-found: warn
