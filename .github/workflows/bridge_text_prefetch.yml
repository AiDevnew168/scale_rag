name: Query-text structural prefetch with no future gold
on:
  push:
    paths:
      - 'research/bridge_partition/query_text_prefetch.py'
      - '.github/workflows/bridge_text_prefetch.yml'
  workflow_dispatch:
jobs:
  prefetch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        family: [bridge_chain, synthesis]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install numpy==2.1.3 pymetis==2025.2.2 scikit-learn==1.6.1 zstandard==0.23.0
      - name: Evaluate query-text prefetch without gold evidence in planner
        env:
          ONLINE_SOURCE: ${{ matrix.family }}
        run: python research/bridge_partition/query_text_prefetch.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: text-prefetch-${{ matrix.family }}
          path: results_text_prefetch_${{ matrix.family }}/
          if-no-files-found: warn
