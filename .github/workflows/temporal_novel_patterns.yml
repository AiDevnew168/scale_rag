name: Genuine future query pattern novelty check
on:
  push:
    paths: ['research/bridge_partition/temporal_novel_patterns.py','.github/workflows/temporal_novel_patterns.yml']
  workflow_dispatch:
jobs:
  patterns:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install numpy==2.1.3 pymetis==2025.2.2 scikit-learn==1.6.1 mtkahypar==1.7.1
      - name: Evaluate unseen predicate sets and deduplicated future demands
        run: python research/bridge_partition/temporal_novel_patterns.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: future-novel-pattern-diagnostics
          path: results_temporal_novelty/
          if-no-files-found: warn
