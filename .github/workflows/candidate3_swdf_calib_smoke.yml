name: Candidate 3 SWDF real four-shard pre-test calibration smoke
on:
  push:
    paths:
      - '.github/workflows/candidate3_swdf_calib_smoke.yml'
      - 'research/bridge_partition/candidate3_swdf_calib_smoke.py'
  workflow_dispatch:
jobs:
  full-SPARQL-calibration-only:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Pinned complete RDF toolchain
        run: pip install pyoxigraph==0.5.13 rdflib==7.5.0 gdown==5.2.0
      - name: Compare 8 untouched calibration queries across central and 4 live SWDF Oxigraph workers
        run: python -u research/bridge_partition/candidate3_swdf_calib_smoke.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: candidate3-SWDF-calibration-four-shard-smoke
          path: results_candidate3_SWDF_calibration_smoke/report.json
          if-no-files-found: warn
