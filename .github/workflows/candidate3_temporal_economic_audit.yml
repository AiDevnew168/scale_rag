name: Candidate 3 temporal physical economic accounting audit (synthetic invariants)
on:
  push:
    paths:
      - 'research/bridge_partition/candidate3_temporal_economic_audit.py'
      - 'research/bridge_partition/test_candidate3_temporal_economic_audit.py'
      - '.github/workflows/candidate3_temporal_economic_audit.yml'
  workflow_dispatch:
jobs:
  audit-invariants:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest research/bridge_partition/test_candidate3_temporal_economic_audit.py -v
