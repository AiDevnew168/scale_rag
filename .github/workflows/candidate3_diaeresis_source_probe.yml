name: Candidate 3 published DIAERESIS original SWDF schema data source
on:
  push:
    paths:
      - '.github/workflows/candidate3_diaeresis_source_probe.yml'
      - 'research/bridge_partition/candidate3_diaeresis_source_probe.py'
  workflow_dispatch:
jobs:
  original-artifact:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Fetch source-author published SWDF schema+instances source only
        run: python -u research/bridge_partition/candidate3_diaeresis_source_probe.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: candidate3-DIAERESIS-source-artifact-eligibility
          path: results_candidate3_diaeresis_original_source/report.json
          if-no-files-found: error
