name: Candidate 3 external SWDF graph/query source metadata gate
on:
  push:
    paths:
      - '.github/workflows/candidate3_external_swdf_metadata.yml'
      - 'research/bridge_partition/candidate3_external_swdf_metadata.py'
  workflow_dispatch:
jobs:
  metadata-only:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check published query-log graph source metadata with bounded network reads
        run: python -u research/bridge_partition/candidate3_external_swdf_metadata.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: candidate3-external-SWDF-source-access
          path: results_candidate3_source_access/report.json
          if-no-files-found: error
