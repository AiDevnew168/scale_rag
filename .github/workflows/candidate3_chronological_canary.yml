name: Candidate 3 chronological canary heldout robustness
on:
  push:
    paths:
      - '.github/workflows/candidate3_chronological_canary.yml'
  workflow_dispatch:
jobs:
  canary:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        month: [january, february, march]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Pinned dependencies
        run: pip install numpy==2.1.3 pymetis==2025.2.2 mtkahypar==1.7.1 scikit-learn==1.6.1
      - name: Evaluate two-day canary and dominant-pattern exclusion
        env:
          CANARY_MONTH: ${{ matrix.month }}
        run: python research/bridge_partition/candidate3_chronological_canary.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: candidate3-canary-${{ matrix.month }}
          path: results_candidate3_canary_${{ matrix.month }}/
          if-no-files-found: error
