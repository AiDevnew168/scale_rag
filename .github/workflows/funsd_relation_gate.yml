name: FUNSD real held-out structural edge decoding
on:
  push:
    paths:
      - 'research/topo_fea/funsd_relation_gate.py'
      - '.github/workflows/funsd_relation_gate.yml'
  workflow_dispatch:
jobs:
  relation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned solvers and linear classifier
        run: pip install numpy==2.1.3 scipy==1.14.1 scikit-learn==1.6.1 networkx==3.4.2
      - name: Execute FUNSD human relation-link gate
        run: python research/topo_fea/funsd_relation_gate.py
      - name: Preserve paired results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: funsd-relation-gate-results
          path: results_relation/
          if-no-files-found: warn
