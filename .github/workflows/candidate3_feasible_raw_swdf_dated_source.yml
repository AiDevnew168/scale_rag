name: Candidate 3 frozen original FEASIBLE SWDF natural dated query-log gate
on:
  push:
    paths:
      - '.github/workflows/candidate3_feasible_raw_swdf_dated_source.yml'
      - 'research/bridge_partition/candidate3_feasible_raw_swdf_dated_source.py'
  workflow_dispatch:
jobs:
  original-full-raw-access-log-eligibility:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned original-source transport
        run: pip install gdown==5.2.0
      - name: Read source-only original timestamped author's SWDF.log.gz WITHOUT data-driven policy
        run: python -u research/bridge_partition/candidate3_feasible_raw_swdf_dated_source.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: candidate3-original-SWDF-dated-log-eligibility
          path: results_candidate3_raw_swdf_provenance/report.json
          if-no-files-found: error
